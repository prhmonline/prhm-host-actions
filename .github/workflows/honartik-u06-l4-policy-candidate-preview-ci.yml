name: U06 Python 3.6-safe Level4 exact policy candidate preview
on:
  push:
    paths:
      - 'scripts/u06/u06_l4_policy_candidate_preview_v1.py'
      - 'tests/u06/test_u06_l4_policy_candidate_preview_v1.py'
      - '.github/workflows/honartik-u06-l4-policy-candidate-preview-ci.yml'
  pull_request:
    paths:
      - 'scripts/u06/u06_l4_policy_candidate_preview_v1.py'
      - 'tests/u06/test_u06_l4_policy_candidate_preview_v1.py'
      - '.github/workflows/honartik-u06-l4-policy-candidate-preview-ci.yml'
permissions:
  contents: read
jobs:
  py311-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tests/u06 -p test_u06_l4_policy_candidate_preview_v1.py -v
  py36-actual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker pull python:3.6.15-slim-buster
      - run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,noexec,size=16m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/repo:ro" -w /repo python:3.6.15-slim-buster \
            python -B -m unittest discover -s tests/u06 \
              -p test_u06_l4_policy_candidate_preview_v1.py -v
