name: U06 native root durable lease and SIGKILL fixture
on:
  pull_request:
    paths:
      - 'honartik-u06-native-root-lease-v1.cjs'
      - 'test-honartik-u06-native-root-lease-v1.cjs'
      - '.github/workflows/honartik-u06-root-lease-sigkill-ci.yml'
  push:
    paths:
      - 'honartik-u06-native-root-lease-v1.cjs'
      - 'test-honartik-u06-native-root-lease-v1.cjs'
      - '.github/workflows/honartik-u06-root-lease-sigkill-ci.yml'
permissions:
  contents: read
jobs:
  linux-fsync-kill-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check honartik-u06-native-root-lease-v1.cjs
      - run: node --test test-honartik-u06-native-root-lease-v1.cjs
