name: LeadOps Backup Role Agent3 Level4 Registration Contract
on:
  push:
    branches:
      - integration/leadops-backup-role-l4-registration-v1-20261012
    paths:
      - 'leadops-backup-role-*'
      - 'test-leadops-backup-role-registration-v1.cjs'
      - '.github/workflows/leadops-backup-role-agent3-registration-ci.yml'
  pull_request:
    paths:
      - 'leadops-backup-role-*'
      - 'test-leadops-backup-role-registration-v1.cjs'
      - '.github/workflows/leadops-backup-role-agent3-registration-ci.yml'
permissions:
  contents: read
jobs:
  pinned-registration-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Node module syntax checks
        run: |
          node --check leadops-backup-role-registration-v1.cjs
          node --check leadops-backup-role-registration-transaction-v1.cjs
          node --check leadops-backup-role-provision-helper-v1.cjs
          node --check test-leadops-backup-role-registration-v1.cjs
      - name: Execute SHA-bound registration and rollback contract tests
        run: node --test test-leadops-backup-role-registration-v1.cjs
