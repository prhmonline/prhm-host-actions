name: Honartik open-price isolated Yii Host Action contract
on:
  push:
    paths:
      - 'honartik-open-price-yii-scratch-v1.cjs'
      - 'test-honartik-open-price-yii-scratch-v1.cjs'
      - '.github/workflows/honartik-open-price-yii-scratch-v1.yml'
  pull_request:
    paths:
      - 'honartik-open-price-yii-scratch-v1.cjs'
      - 'test-honartik-open-price-yii-scratch-v1.cjs'
      - '.github/workflows/honartik-open-price-yii-scratch-v1.yml'
permissions:
  contents: read
jobs:
  node-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check honartik-open-price-yii-scratch-v1.cjs
      - run: node --check test-honartik-open-price-yii-scratch-v1.cjs
      - run: node --test test-honartik-open-price-yii-scratch-v1.cjs
