      - 'honartik-config-center-atomic-registration-installer-v1.cjs'
      - 'test-honartik-config-center-atomic-registration-installer-v1.cjs'
      - 'tests/honartik_config_center_sqlite_contract_test.py'
      - 'tests/honartik_config_center_mariadb_integration.php'
      - 'prhm-action-registry-gateway-v1.cjs'
      - 'prhm-action-registry-host-actions-v2-bridge-v1.cjs'
