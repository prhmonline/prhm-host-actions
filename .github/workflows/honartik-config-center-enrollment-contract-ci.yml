name: Honartik Config Center Enrollment Action Contract

on:
  pull_request:
    paths:
      - 'honartik-config-center-enrollment-action-v1.cjs'
      - 'test-honartik-config-center-enrollment-action-v1.cjs'
      - 'honartik-config-center-registration-candidate-v1.cjs'
      - 'honartik-config-center-trusted-adapter-v1.cjs'
      - 'scripts/honartik-config-center-prod-enroll-20261012.php'
      - 'test-honartik-config-center-php-revocation-v1.cjs'
      - 'test-honartik-config-center-trusted-adapter-v1.cjs'
      - 'test-honartik-config-center-registration-candidate-v1.cjs'
      - '.github/workflows/honartik-config-center-enrollment-contract-ci.yml'
  push:
    branches:
      - 'integration/honartik-config-center-enrollment-action-v1-20261012'
    paths:
      - 'honartik-config-center-enrollment-action-v1.cjs'
      - 'test-honartik-config-center-enrollment-action-v1.cjs'
      - 'honartik-config-center-registration-candidate-v1.cjs'
      - 'honartik-config-center-trusted-adapter-v1.cjs'
      - 'scripts/honartik-config-center-prod-enroll-20261012.php'
      - 'test-honartik-config-center-php-revocation-v1.cjs'
      - 'test-honartik-config-center-trusted-adapter-v1.cjs'
      - 'test-honartik-config-center-registration-candidate-v1.cjs'
      - '.github/workflows/honartik-config-center-enrollment-contract-ci.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax and offline fail-closed contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check honartik-config-center-enrollment-action-v1.cjs
          node --check test-honartik-config-center-enrollment-action-v1.cjs
          node --check honartik-config-center-registration-candidate-v1.cjs
          node --check test-honartik-config-center-registration-candidate-v1.cjs
          node --check honartik-config-center-trusted-adapter-v1.cjs
          node --check test-honartik-config-center-trusted-adapter-v1.cjs
          node --check test-honartik-config-center-php-revocation-v1.cjs
          node --test test-honartik-config-center-enrollment-action-v1.cjs test-honartik-config-center-registration-candidate-v1.cjs test-honartik-config-center-trusted-adapter-v1.cjs test-honartik-config-center-php-revocation-v1.cjs
          php -l scripts/honartik-config-center-prod-enroll-20261012.php
          sha256sum scripts/honartik-config-center-prod-enroll-20261012.php
          test "$(sha256sum scripts/honartik-config-center-prod-enroll-20261012.php | cut -d' ' -f1)" = "9ccbcbdba457691e1d140d6e32ad379cbe6d98d5448c13970220c72ba2e8278c"
          test "$(git rev-parse a9da4735445dcd0833cd1ef5435c77884cb74e64:scripts/honartik-config-center-prod-enroll-20261012.php)" = "97de1aab42d2a7f67aeef66ead4a8a2bc1da9f1f"
          test "$(git show a9da4735445dcd0833cd1ef5435c77884cb74e64:scripts/honartik-config-center-prod-enroll-20261012.php | sha256sum | cut -d' ' -f1)" = "9ccbcbdba457691e1d140d6e32ad379cbe6d98d5448c13970220c72ba2e8278c"
