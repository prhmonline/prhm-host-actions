name: MoeinShow M03 read-only release preflight contract

on:
  pull_request:
    paths:
      - 'moeinshow-m03-readonly-preflight-v1.js'
      - 'test-moeinshow-m03-readonly-preflight-v1.js'
      - '.github/workflows/moeinshow-m03-readonly-preflight-ci.yml'
  push:
    branches:
      - 'fix/moeinshow-m03-readonly-preflight-v1'
    paths:
      - 'moeinshow-m03-readonly-preflight-v1.js'
      - 'test-moeinshow-m03-readonly-preflight-v1.js'
      - '.github/workflows/moeinshow-m03-readonly-preflight-ci.yml'

permissions:
  contents: read

jobs:
  preflight-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check syntax
        run: |
          node --check moeinshow-m03-readonly-preflight-v1.js
          node --check test-moeinshow-m03-readonly-preflight-v1.js
      - name: Run fail-closed M03 contract tests
        run: node --test test-moeinshow-m03-readonly-preflight-v1.js
