name: Universal backup-only server-local readiness (read-only)
on:
  pull_request:
    paths:
      - 'universal-installer-backup-only-server-local-readiness-v1.cjs'
      - 'test-universal-installer-backup-only-server-local-readiness-v1.cjs'
      - 'universal-installer-backup-only-native-contract-v1.cjs'
      - 'docs/runbooks/universal-backup-only-server-local-readiness-20261103.md'
      - '.github/workflows/universal-backup-only-server-local-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-readiness-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify pure fail-closed readiness contract
        run: node --test test-universal-installer-backup-only-server-local-readiness-v1.cjs
      - name: Syntax checks
        run: |
          node --check universal-installer-backup-only-server-local-readiness-v1.cjs
          node --check test-universal-installer-backup-only-server-local-readiness-v1.cjs
