name: Host Actions v29 MoeinShow Wallet Cutover CI

on:
  pull_request:
    paths:
      - 'bootstrap-host-actions-v29-moeinshow-wallet-cutover.js'
      - 'moeinshow-wallet-cutover-v1.helper.js'
      - 'test-v29-moeinshow-wallet-cutover.js'
      - '.github/workflows/host-actions-v29-moeinshow-wallet-cutover-ci.yml'
  push:
    branches:
      - integration/v29-moeinshow-wallet-cutover
    paths:
      - 'bootstrap-host-actions-v29-moeinshow-wallet-cutover.js'
      - 'moeinshow-wallet-cutover-v1.helper.js'
      - 'test-v29-moeinshow-wallet-cutover.js'
      - '.github/workflows/host-actions-v29-moeinshow-wallet-cutover-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Contract
        run: node --test test-v29-moeinshow-wallet-cutover.js
      - name: Syntax
        if: always()
        run: |
          node --check bootstrap-host-actions-v29-moeinshow-wallet-cutover.js
          node --check moeinshow-wallet-cutover-v1.helper.js
      - name: Selftest
        if: success()
        run: node bootstrap-host-actions-v29-moeinshow-wallet-cutover.js --selftest-only
