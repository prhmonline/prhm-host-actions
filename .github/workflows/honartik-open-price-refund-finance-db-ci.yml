name: Honartik atomic refund DB rehearsal (isolated MariaDB 10.6)
on:
  push:
    paths:
      - '.github/workflows/honartik-open-price-refund-finance-db-ci.yml'
      - 'test-fixtures/honartik-open-price-finance/**'
  pull_request:
    paths:
      - '.github/workflows/honartik-open-price-refund-finance-db-ci.yml'
      - 'test-fixtures/honartik-open-price-finance/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-refund-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, intl
          coverage: none
          tools: composer:v2
      - name: Check fixed-scope source fingerprint
        shell: bash
        run: |
          set -euo pipefail
          root=test-fixtures/honartik-open-price-finance
          test "$(jq -r .production_access "$root/refund-source-manifest.json")" = false
          while IFS=$'\t' read -r rel sha; do
            test "$(git hash-object "$root/$rel")" = "$sha"
            php -l "$root/$rel"
          done < <(jq -r '.files[] | [.path,.blob] | @tsv' "$root/refund-source-manifest.json")
      - name: Install Yii2 in CI sandbox
        shell: bash
        working-directory: test-fixtures/honartik-open-price-finance/app
        run: |
          composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-dev
      - name: Start isolated MariaDB 10.6
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -d --pull always --name honartik-open-price-refund-fixture \
            --network none --memory 768m --cpus 1 --pids-limit 128 \
            -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=1 -v /tmp:/tmp:rw \
            mariadb:10.6 --skip-networking --socket=/tmp/honartik-ledger-refund.sock --pid-file=/tmp/honartik-ledger-refund.pid
          test "$(docker inspect -f '{{.HostConfig.NetworkMode}}' honartik-open-price-refund-fixture)" = none
          ready=NO
          for try in $(seq 1 90); do
            if docker exec honartik-open-price-refund-fixture mariadb -uroot \
              --socket=/tmp/honartik-ledger-refund.sock -Nse 'SELECT @@skip_networking' 2>/dev/null | grep -qx 1; then
              ready=YES; break
            fi
            sleep 2
          done
          test "$ready" = YES
          docker exec honartik-open-price-refund-fixture mariadb -uroot \
            --socket=/tmp/honartik-ledger-refund.sock \
            -e 'CREATE DATABASE honartik_finance_fixture CHARACTER SET utf8mb4'
      - name: Execute real cancellation service with synthetic financial rows
        shell: bash
        env:
          HONARTIK_OPEN_PRICE_FIXTURE: 'YES'
          HONARTIK_OPEN_PRICE_FIXTURE_SOCKET: '/tmp/honartik-ledger-refund.sock'
        run: |
          set -euo pipefail
          php test-fixtures/honartik-open-price-finance/app/tests/integration/OpenPriceCancellationFixtureTest.php
      - name: Verify real ticketing ActiveRecord sources
        shell: bash
        run: |
          set -euo pipefail
          root=test-fixtures/honartik-open-price-finance
          test "$(jq -r .production_access "$root/real-seat-source-manifest.json")" = false
          while IFS=        shell: bash
        if: always()
        run: |
          docker rm -f honartik-open-price-refund-fixture >/dev/null 2>&1 || true
          sudo rm -f -- /tmp/honartik-ledger-refund.sock /tmp/honartik-ledger-refund.pid
          test ! -e /tmp/honartik-ledger-refund.sock
          echo 'ATOMIC_REFUND_DB_FIXTURE_CLEANUP=PASS'
\t' read -r rel sha; do
            test "$(git hash-object "$root/$rel")" = "$sha"
            php -l "$root/$rel"
          done < <(jq -r '.files[] | [.path,.blob] | @tsv' "$root/real-seat-source-manifest.json")
      - name: Execute real Reserve afterSave seat and financial rollback contract
        shell: bash
        env:
          HONARTIK_OPEN_PRICE_FIXTURE: 'YES'
          HONARTIK_OPEN_PRICE_FIXTURE_SOCKET: '/tmp/honartik-ledger-refund.sock'
        run: |
          set -euo pipefail
          php test-fixtures/honartik-open-price-finance/app/tests/integration/OpenPriceActualReserveSeatTest.php
      - name: Cleanup isolated container and socket
        shell: bash
        if: always()
        run: |
          docker rm -f honartik-open-price-refund-fixture >/dev/null 2>&1 || true
          sudo rm -f -- /tmp/honartik-ledger-refund.sock /tmp/honartik-ledger-refund.pid
          test ! -e /tmp/honartik-ledger-refund.sock
          echo 'ATOMIC_REFUND_DB_FIXTURE_CLEANUP=PASS'
