name: U06 exact Root L4 sealed JWS forwarding bridge source review
on:
  pull_request:
    paths:
      - 'honartik-u06-root-executor-sealed-token-bridge-review-v1.cjs'
      - 'test-honartik-u06-root-executor-sealed-token-bridge-review-v1.cjs'
      - '.github/workflows/honartik-u06-sealed-l4-context-bridge-ci.yml'
  push:
    paths:
      - 'honartik-u06-root-executor-sealed-token-bridge-review-v1.cjs'
      - 'test-honartik-u06-root-executor-sealed-token-bridge-review-v1.cjs'
      - '.github/workflows/honartik-u06-sealed-l4-context-bridge-ci.yml'
permissions:
  contents: read
jobs:
  token-consumed-before-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check honartik-u06-root-executor-sealed-token-bridge-review-v1.cjs
      - run: node --test test-honartik-u06-root-executor-sealed-token-bridge-review-v1.cjs
