name: Honartik Root Installer Real Scratch-Disk Failure & Crash Recovery
on:
  push:
    branches:
      - feat/honartik-iticket-sha-bound-release-v1-20261015
    paths:
      - 'honartik-iticket-root-installer-disk-fixture-v1.cjs'
      - 'test-honartik-iticket-root-installer-disk-fixture-v1.cjs'
      - 'honartik-iticket-root-installer-transaction-engine-v1.cjs'
      - '.github/workflows/honartik-iticket-root-installer-disk-fixture-ci.yml'
  pull_request:
    paths:
      - 'honartik-iticket-root-installer-disk-fixture-v1.cjs'
      - 'test-honartik-iticket-root-installer-disk-fixture-v1.cjs'
      - 'honartik-iticket-root-installer-transaction-engine-v1.cjs'
      - '.github/workflows/honartik-iticket-root-installer-disk-fixture-ci.yml'

permissions:
  contents: read

jobs:
  scratch_disk_only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax and real disk scratch transaction failovers (never Production)
        run: |
          set -Eeuo pipefail
          node --check honartik-iticket-root-installer-disk-fixture-v1.cjs
          node --check test-honartik-iticket-root-installer-disk-fixture-v1.cjs
          node --test test-honartik-iticket-root-installer-disk-fixture-v1.cjs
          echo "REAL_TEMP_DISK_JOURNAL_RENAME_TEST=PASS"
          echo "PRODUCTION_MUTATION=NO"
          echo "PRODUCTION_INSTALL_AUTHORIZED=NO"
