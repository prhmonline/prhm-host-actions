name: Solo Operations Auditor CI
on:
  push:
    paths:
      - 'solo-ops-auditor/**'
      - '.github/workflows/solo-ops-auditor-ci.yml'
  pull_request:
    paths:
      - 'solo-ops-auditor/**'
      - '.github/workflows/solo-ops-auditor-ci.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check solo-ops-auditor/queue.mjs
      - run: node --check solo-ops-auditor/auditor.mjs
      - run: node --test solo-ops-auditor/test-auditor.mjs
