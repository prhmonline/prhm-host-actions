name: WAHA Registration Policy Guard V8
on:
  push:
    paths:
      - 'test-waha-registration-policy-guard-v8.mjs'
      - '.github/workflows/waha-registration-policy-guard-v8.yml'
  pull_request:
    paths:
      - 'test-waha-registration-policy-guard-v8.mjs'
      - '.github/workflows/waha-registration-policy-guard-v8.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fail-closed policy regression (read only)
        run: |
          node --check test-waha-registration-policy-guard-v8.mjs
          node --test test-waha-registration-policy-guard-v8.mjs
      - name: Existing V7 integration contract
        run: |
          node --test test-waha-shared-run-v7.mjs
