name: Honartik iTicket Root Installer Semantics Audit (Offline Only)

on:
  push:
    branches:
      - feat/honartik-iticket-sha-bound-release-v1-20261015
    paths:
      - 'honartik-iticket-root-installer-semantics-audit-v1.cjs'
      - 'test-honartik-iticket-root-installer-semantics-audit-v1.cjs'
      - '.github/workflows/honartik-iticket-root-installer-semantics-audit-ci.yml'
  pull_request:
    paths:
      - 'honartik-iticket-root-installer-semantics-audit-v1.cjs'
      - 'test-honartik-iticket-root-installer-semantics-audit-v1.cjs'
      - '.github/workflows/honartik-iticket-root-installer-semantics-audit-ci.yml'

permissions:
  contents: read

jobs:
  audit_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify pure static audit only (no Production / no approval)
        run: |
          set -Eeuo pipefail
          node --check honartik-iticket-root-installer-semantics-audit-v1.cjs
          node --check test-honartik-iticket-root-installer-semantics-audit-v1.cjs
          node --test test-honartik-iticket-root-installer-semantics-audit-v1.cjs
          echo "SEMANTIC_AUDIT_SOURCE_ONLY=YES"
          echo "PRODUCTION_MUTATION=NO"
          echo "SIGNED_INSTALL_AUTHORIZED=NO"
