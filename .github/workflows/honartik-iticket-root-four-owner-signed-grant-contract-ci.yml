name: Honartik Four-Owner Ed25519 Level4 Grant Contract (Offline)
on:
  push:
    branches: [feat/honartik-iticket-sha-bound-release-v1-20261015]
    paths:
      - 'honartik-iticket-root-four-owner-signed-grant-contract-v1.cjs'
      - 'test-honartik-iticket-root-four-owner-signed-grant-contract-v1.cjs'
      - '.github/workflows/honartik-iticket-root-four-owner-signed-grant-contract-ci.yml'
  pull_request:
    paths:
      - 'honartik-iticket-root-four-owner-signed-grant-contract-v1.cjs'
      - 'test-honartik-iticket-root-four-owner-signed-grant-contract-v1.cjs'
      - '.github/workflows/honartik-iticket-root-four-owner-signed-grant-contract-ci.yml'
permissions:
  contents: read
jobs:
  source_only_grant_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Denial suite with generated disposable Ed25519 keys
        run: |
          set -Eeuo pipefail
          node --check honartik-iticket-root-four-owner-signed-grant-contract-v1.cjs
          node --check test-honartik-iticket-root-four-owner-signed-grant-contract-v1.cjs
          node --test test-honartik-iticket-root-four-owner-signed-grant-contract-v1.cjs
          echo 'SIGNED_GRANT_FIXTURE_CONTRACT=PASS'
          echo 'LIVE_ISSUER_PROTOCOL_COMPATIBILITY=NOT_ATTESTED'
          echo 'LIVE_ISSUER_PUBLIC_KEY_PIN=NOT_ATTESTED'
          echo 'SERVER_SIDE_REPLAY_ENFORCEMENT=NOT_ATTESTED'
          echo 'AUTHORIZED_ROOT_TRANSACTION=NO'
          echo 'PRODUCTION_MUTATION=NO'
