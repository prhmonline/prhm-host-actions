name: U06 native signed Level 4 receipt verified from Ed25519 and consumed ledger
on:
  push:
    paths:
      - 'honartik-u06-native-l4-consumed-receipt-v1.cjs'
      - 'test-honartik-u06-native-l4-consumed-receipt-v1.cjs'
      - '.github/workflows/honartik-u06-native-l4-cryptographic-ci.yml'
  pull_request:
    paths:
      - 'honartik-u06-native-l4-consumed-receipt-v1.cjs'
      - 'test-honartik-u06-native-l4-consumed-receipt-v1.cjs'
      - '.github/workflows/honartik-u06-native-l4-cryptographic-ci.yml'
permissions:
  contents: read
jobs:
  verify-cryptographic-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check honartik-u06-native-l4-consumed-receipt-v1.cjs
      - run: node --test test-honartik-u06-native-l4-consumed-receipt-v1.cjs
