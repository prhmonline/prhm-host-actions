name: U06 native coordinator recovery lease guarantees
on:
  pull_request:
    paths:
      - 'honartik-u06-owner-native-transaction-v1.cjs'
      - 'test-honartik-u06-owner-native-transaction-v1.cjs'
      - '.github/workflows/honartik-u06-native-recovery-lease-ci.yml'
  push:
    paths:
      - 'honartik-u06-owner-native-transaction-v1.cjs'
      - 'test-honartik-u06-owner-native-transaction-v1.cjs'
      - '.github/workflows/honartik-u06-native-recovery-lease-ci.yml'
permissions:
  contents: read
jobs:
  coordinator-crash-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check honartik-u06-owner-native-transaction-v1.cjs
      - run: node --test test-honartik-u06-owner-native-transaction-v1.cjs
