name: host-actions-v32-current-owner-binding-mcp-source-ci
on:
  workflow_dispatch:
  push:
    branches:
      - fix/current-owner-binding-v32-mcp-source-owner
  pull_request:
    paths:
      - 'current-owner-binding-*.js'
      - 'bootstrap-host-actions-v29-current-owner-binding-refresh.js'
      - 'test-v29-current-owner-binding-refresh.js'
      - '.github/workflows/host-actions-v29-current-owner-binding-refresh-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax
        run: |
          node --check current-owner-binding-manifest-v1.js
          node --check current-owner-binding-adapters-v1.js
          node --check current-owner-binding-systemd-v1.js
          node --check current-owner-binding-refresh-v1.js
          node --check current-owner-binding-runtime-v1.js
          node --check bootstrap-host-actions-v29-current-owner-binding-refresh.js
      - name: Module fingerprints
        run: |
          sha256sum \
            current-owner-binding-manifest-v1.js \
            current-owner-binding-adapters-v1.js \
            current-owner-binding-systemd-v1.js \
            current-owner-binding-refresh-v1.js \
            current-owner-binding-runtime-v1.js
      - name: Focused tests
        run: |
          node --test \
            test-current-owner-binding-manifest-v1.js \
            test-current-owner-binding-adapters-v1.js \
            test-current-owner-binding-systemd-v1.js \
            test-current-owner-binding-refresh-v1.js \
            test-current-owner-binding-runtime-v1.js \
            test-v29-current-owner-binding-refresh.js
      - name: Installer selftest
        run: node bootstrap-host-actions-v29-current-owner-binding-refresh.js --selftest-only
