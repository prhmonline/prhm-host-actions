name: Recovery Edge Topology Probe V1 CI

on:
  push:
    branches:
      - main
      - 'feature/recovery-edge-topology-probe-v1'
    paths:
      - 'recovery-edge-topology-probe-v1.js'
      - 'test-recovery-edge-topology-probe-v1.js'
      - '.github/workflows/recovery-edge-topology-probe-v1-ci.yml'
  pull_request:
    paths:
      - 'recovery-edge-topology-probe-v1.js'
      - 'test-recovery-edge-topology-probe-v1.js'
      - '.github/workflows/recovery-edge-topology-probe-v1-ci.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test test-recovery-edge-topology-probe-v1.js
