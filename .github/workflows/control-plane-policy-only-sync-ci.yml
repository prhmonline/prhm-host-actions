name: Control Plane Policy-Only Level4 Sync Contract

on:
  push:
    branches:
      - 'ops/leadops-policy-git-first-runtime-sync-20261012'
    paths:
      - 'leadops-policy-sync-*'
      - 'test-leadops-policy-sync-candidate-v1.cjs'
      - 'tests/fixtures/leadops-live-policy-20261012.json.gz.b64'
      - '.github/workflows/control-plane-policy-only-sync-ci.yml'
  pull_request:
    paths:
      - 'leadops-policy-sync-*'
      - 'test-leadops-policy-sync-candidate-v1.cjs'
      - 'tests/fixtures/leadops-live-policy-20261012.json.gz.b64'
      - '.github/workflows/control-plane-policy-only-sync-ci.yml'

permissions:
  contents: read

jobs:
  fixed-policy-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate Node syntax and canonical JSON
        run: |
          node --check leadops-policy-sync-candidate-v1.cjs
          node --check test-leadops-policy-sync-candidate-v1.cjs
          node -e "JSON.parse(require('fs').readFileSync('leadops-policy-sync-canonical-20261012.json','utf8'))"
      - name: Test exact owner and canonical fingerprints with fail-closed rollback
        run: node --test test-leadops-policy-sync-candidate-v1.cjs
