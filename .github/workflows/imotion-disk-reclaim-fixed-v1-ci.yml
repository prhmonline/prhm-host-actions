name: iMotion Fixed Disk Reclaim Review Gate
on:
  pull_request:
    paths:
      - 'ops/imotion-disk-reclaim-fixed-v1.cjs'
      - 'ops/imotion-disk-reclaim-fixed-v1.test.cjs'
      - 'ops/imotion-disk-reclaim-registration-readiness-v1.cjs'
      - 'ops/imotion-disk-reclaim-registration-readiness-v1.test.cjs'
      - '.github/workflows/imotion-disk-reclaim-fixed-v1-ci.yml'
  push:
    branches:
      - 'feature/imotion-disk-reclaim-fixed-v1-20261027'
    paths:
      - 'ops/imotion-disk-reclaim-fixed-v1.cjs'
      - 'ops/imotion-disk-reclaim-fixed-v1.test.cjs'
      - 'ops/imotion-disk-reclaim-registration-readiness-v1.cjs'
      - 'ops/imotion-disk-reclaim-registration-readiness-v1.test.cjs'
      - '.github/workflows/imotion-disk-reclaim-fixed-v1-ci.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax
        run: |
          node --check ops/imotion-disk-reclaim-fixed-v1.cjs
          node --check ops/imotion-disk-reclaim-fixed-v1.test.cjs
          node --check ops/imotion-disk-reclaim-registration-readiness-v1.cjs
          node --check ops/imotion-disk-reclaim-registration-readiness-v1.test.cjs
      - name: Unit tests
        run: node --test ops/imotion-disk-reclaim-fixed-v1.test.cjs ops/imotion-disk-reclaim-registration-readiness-v1.test.cjs
      - name: Reject direct shell, host mutation, network and execution surfaces
        run: |
          if grep -En 'child_process|execSync|spawnSync|unlinkSync|rmSync|writeFile|https?\.request|fetch\(' ops/imotion-disk-reclaim-fixed-v1.cjs ops/imotion-disk-reclaim-registration-readiness-v1.cjs; then
            echo 'Forbidden direct shell/file/network API in source candidate'
            exit 1
          fi
