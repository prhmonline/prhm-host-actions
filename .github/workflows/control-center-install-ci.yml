name: Control Center Install Contract

on:
  push:
    branches:
      - feature/control-center-install-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run installer contract
        run: node --test test-control-center-install-v1.js
      - name: Print installer SHA-256
        run: sha256sum control-center-install-v1.js
