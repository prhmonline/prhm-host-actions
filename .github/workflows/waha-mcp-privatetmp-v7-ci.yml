name: WAHA MCP PrivateTmp V7 CI
on:
  push:
    paths:
      - 'safeFiles-waha-shared-run-v7.mjs'
      - 'test-waha-shared-run-v7.mjs'
      - '.github/workflows/waha-mcp-privatetmp-v7-ci.yml'
  pull_request:
    paths:
      - 'safeFiles-waha-shared-run-v7.mjs'
      - 'test-waha-shared-run-v7.mjs'
      - '.github/workflows/waha-mcp-privatetmp-v7-ci.yml'
jobs:
  namespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax and PrivateTmp contract
        run: |
          node --check safeFiles-waha-shared-run-v7.mjs
          node --check test-waha-shared-run-v7.mjs
          node --test test-waha-shared-run-v7.mjs
      - name: Previous HA integrity regressions
        run: |
          node --test test-waha-current-owners-v6.mjs
          node --test test-waha-handler-shadow-v5.mjs
          node --test test-waha-systemd-journal-v4.mjs
