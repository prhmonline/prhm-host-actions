name: Honartik open-price producer settlement safety (no DB/bank)
on:
  push:
    paths:
      - '.github/workflows/honartik-open-price-settlement-contract.yml'
      - 'test-fixtures/honartik-open-price-settlement/**'
  pull_request:
    paths:
      - '.github/workflows/honartik-open-price-settlement-contract.yml'
      - 'test-fixtures/honartik-open-price-settlement/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seller-settlement-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Verify exact source snapshots and syntax
        shell: bash
        run: |
          set -euo pipefail
          root=test-fixtures/honartik-open-price-settlement
          test "$(jq -r .backend_source_commit "$root/source-manifest.json" | wc -c)" -eq 41
          while IFS=$'\t' read -r file blob; do
            test "$(git hash-object "$root/$file")" = "$blob"
            php -l "$root/$file"
          done < <(jq -r '.files[] | [.path,.blob] | @tsv' "$root/source-manifest.json")
      - name: Run actual pure PHP settlement review and model-wiring contract
        run: php test-fixtures/honartik-open-price-settlement/app/tests/contract/OpenPriceSettlementGuardTest.php
