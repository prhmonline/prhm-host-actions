name: Honartik Universal Installer L4 — Source Contract Only

on:
  # PR #223 targets another review branch; a narrowly scoped push trigger
  # validates source/fixtures even when the PR event has no eligible run.
  push:
    branches:
      - review/issue-217-native-root-preflight
  pull_request:
    paths:
      - 'honartik-universal-installer-l4-v1.cjs'
      - 'test-honartik-universal-installer-l4-v1.cjs'
      - 'honartik-universal-installer-native-fs-v1.cjs'
      - 'test-honartik-universal-installer-native-fs-v1.cjs'
      - 'honartik-universal-installer-l4-approval-verify-v1.cjs'
      - 'test-honartik-universal-installer-l4-approval-verify-v1.cjs'
      - 'honartik-universal-installer-native-root-preflight-v1.cjs'
      - 'test-honartik-universal-installer-native-root-preflight-v1.cjs'
      - 'honartik-universal-installer-native-approval-gate-v1.cjs'
      - 'test-honartik-universal-installer-native-approval-gate-v1.cjs'
      - 'honartik-universal-installer-native-l4-fence-v1.cjs'
      - 'test-honartik-universal-installer-native-l4-fence-v1.cjs'
      - 'honartik-universal-installer-native-recovery-transaction-v1.cjs'
      - 'test-honartik-universal-installer-native-recovery-transaction-v1.cjs'
      - 'honartik-universal-installer-native-journal-inspector-v1.cjs'
      - 'test-honartik-universal-installer-native-journal-inspector-v1.cjs'
      - 'honartik-universal-installer-python-outer-journal-fixture-v1.py'
      - 'test-honartik-universal-installer-real-python-fixture-v1.py'
      - 'manifests/honartik-universal-installer-l4-issue217.json'
      - 'docs/runbooks/honartik-universal-installer-l4-issue217.md'
      - '.github/workflows/honartik-universal-installer-l4-contract.yml'

permissions:
  contents: read

jobs:
  source-only-negative-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax and isolated tests
        shell: bash
        run: |
          set -euo pipefail
          # No private installed Python engine bytes are in this repository.
          # Syntax is checked; real-install integration requires a separately
          # verified, non-root fixture containing the exact live source bytes.
          python3 -m py_compile honartik-universal-installer-python-outer-journal-fixture-v1.py test-honartik-universal-installer-real-python-fixture-v1.py
          echo 'PYTHON_SYNTAX_ONLY=PASS REAL_INSTALL_FIXTURE=NOT_EXECUTED'
          node --check honartik-universal-installer-l4-v1.cjs
          node --check test-honartik-universal-installer-l4-v1.cjs
          node --check honartik-universal-installer-native-fs-v1.cjs
          node --check test-honartik-universal-installer-native-fs-v1.cjs
          node --check honartik-universal-installer-l4-approval-verify-v1.cjs
          node --check test-honartik-universal-installer-l4-approval-verify-v1.cjs
          node --check honartik-universal-installer-native-root-preflight-v1.cjs
          node --check test-honartik-universal-installer-native-root-preflight-v1.cjs
          node --check honartik-universal-installer-native-approval-gate-v1.cjs
          node --check test-honartik-universal-installer-native-approval-gate-v1.cjs
          node --check honartik-universal-installer-native-l4-fence-v1.cjs
          node --check test-honartik-universal-installer-native-l4-fence-v1.cjs
          node --check honartik-universal-installer-native-recovery-transaction-v1.cjs
          node --check test-honartik-universal-installer-native-recovery-transaction-v1.cjs
          node --check honartik-universal-installer-native-journal-inspector-v1.cjs
          node --check test-honartik-universal-installer-native-journal-inspector-v1.cjs
          node --test \
            test-honartik-universal-installer-l4-v1.cjs \
            test-honartik-universal-installer-native-fs-v1.cjs \
            test-honartik-universal-installer-l4-approval-verify-v1.cjs \
            test-honartik-universal-installer-native-root-preflight-v1.cjs \
            test-honartik-universal-installer-native-approval-gate-v1.cjs \
            test-honartik-universal-installer-native-l4-fence-v1.cjs \
            test-honartik-universal-installer-native-recovery-transaction-v1.cjs \
            test-honartik-universal-installer-native-journal-inspector-v1.cjs
      - name: Assert no runtime installation authorized
        shell: bash
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const m=require('./manifests/honartik-universal-installer-l4-issue217.json');
          const op=require('./honartik-universal-installer-l4-v1.cjs');
          assert.equal(m.registered_on_host,false);
          assert.equal(m.production_executable,false);
          assert.equal(m.root_adapter_implemented,false);
          assert.equal(m.approval_issued,false);
          assert.equal(m.backend_deployed,false);
          assert.equal(op.CONTRACT.installer_only,true);
          assert.equal(op.CONTRACT.no_yii_migrations,true);
          assert.equal(op.CONTRACT.candidate_digest,m.candidate_digest);
          console.log('CONTRACT_TESTS_ONLY=PASS HOST_INSTALL=NOT_AUTHORIZED');
          NODE
