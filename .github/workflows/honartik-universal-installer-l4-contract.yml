name: Honartik Universal Installer L4 — Source Contract Only

on:
  # PR #223 targets another review branch; a narrowly scoped push trigger
  # validates source/fixtures even when the PR event has no eligible run.
  push:
    branches:
      - review/issue-217-native-root-preflight
      - review/issue-217-native-dispatch-trust-boundary
  pull_request:
    paths:
      - 'honartik-universal-installer-l4-v1.cjs'
      - 'test-honartik-universal-installer-l4-v1.cjs'
      - 'honartik-universal-installer-native-fs-v1.cjs'
      - 'test-honartik-universal-installer-native-fs-v1.cjs'
      - 'honartik-universal-installer-native-root-receipt-v1.cjs'
      - 'test-honartik-universal-installer-native-root-receipt-v1.cjs'
      - 'honartik-universal-installer-l4-approval-verify-v1.cjs'
      - 'test-honartik-universal-installer-l4-approval-verify-v1.cjs'
      - 'honartik-universal-installer-native-root-preflight-v1.cjs'
      - 'test-honartik-universal-installer-native-root-preflight-v1.cjs'
      - 'honartik-universal-installer-native-approval-gate-v1.cjs'
      - 'test-honartik-universal-installer-native-approval-gate-v1.cjs'
      - 'honartik-universal-installer-native-l4-fence-v1.cjs'
      - 'test-honartik-universal-installer-native-l4-fence-v1.cjs'
      - 'honartik-universal-installer-native-recovery-transaction-v1.cjs'
      - 'test-honartik-universal-installer-native-recovery-transaction-v1.cjs'
      - 'honartik-universal-installer-native-journal-inspector-v1.cjs'
      - 'test-honartik-universal-installer-native-journal-inspector-v1.cjs'
      - 'honartik-universal-installer-native-journal-writer-v1.cjs'
      - 'test-honartik-universal-installer-native-journal-writer-v1.cjs'
      - 'honartik-universal-installer-native-python-bridge-v1.cjs'
      - 'test-honartik-universal-installer-native-python-bridge-v1.cjs'
      - 'honartik-universal-installer-native-reconciler-v1.cjs'
      - 'test-honartik-universal-installer-native-reconciler-v1.cjs'
      - 'honartik-universal-installer-native-terminal-archive-v1.cjs'
      - 'honartik-universal-installer-registration-review-pack-v1.cjs'
      - 'test-honartik-universal-installer-registration-review-pack-v1.cjs'
      - 'honartik-universal-installer-owner-registration-candidate-v1.cjs'
      - 'test-honartik-universal-installer-owner-registration-candidate-v1.cjs'
      - 'honartik-universal-installer-native-root-transaction-v1.cjs'
      - 'test-honartik-universal-installer-native-root-transaction-v1.cjs'
      - 'honartik-universal-installer-native-dispatch-trust-v1.cjs'
      - 'test-honartik-universal-installer-native-dispatch-trust-v1.cjs'
      - 'honartik-universal-installer-native-dispatch-registration-review-v1.cjs'
      - 'test-honartik-universal-installer-native-dispatch-registration-review-v1.cjs'
      - 'manifests/honartik-universal-installer-native-registration-review-v1.json'
      - 'honartik-universal-installer-journal-finalize-fixture-v1.cjs'
      - 'test-honartik-universal-installer-journal-finalize-fixture-v1.cjs'
      - 'honartik-universal-installer-python-outer-journal-fixture-v1.py'
      - 'test-honartik-universal-installer-real-python-fixture-v1.py'
      - 'manifests/honartik-universal-installer-l4-issue217.json'
      - 'docs/runbooks/honartik-universal-installer-l4-issue217.md'
      - 'honartik-universal-installer-owner-bootstrap-native-fs-v1.cjs'
      - 'test-honartik-universal-installer-owner-bootstrap-linux-v1.cjs'
      - 'test-honartik-universal-installer-owner-bootstrap-crash-child-v1.cjs'
      - 'honartik-universal-installer-owner-bootstrap-plan-review-v1.cjs'
      - 'test-honartik-universal-installer-owner-bootstrap-plan-review-v1.cjs'
      - 'test-honartik-universal-installer-owner-bootstrap-systemd-vm-v1.cjs'
      - 'tools/honartik217-provider-readiness-v1.py'
      - 'docs/runbooks/honartik-provider-root-bootstrap-acceptance-v1.md'
      - '.github/workflows/honartik-universal-installer-l4-contract.yml'

permissions:
  contents: read

jobs:
  source-only-negative-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax and isolated tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/honartik217-provider-readiness-v1.py --ci-source
          python3 -m py_compile tools/honartik217-provider-readiness-v1.py
          # No private installed Python engine bytes are in this repository.
          # Syntax is checked; real-install integration requires a separately
          # verified, non-root fixture containing the exact live source bytes.
          python3 -m py_compile honartik-universal-installer-python-outer-journal-fixture-v1.py test-honartik-universal-installer-real-python-fixture-v1.py
          echo 'PYTHON_SYNTAX_ONLY=PASS REAL_INSTALL_FIXTURE=NOT_EXECUTED'
          node --check honartik-universal-installer-l4-v1.cjs
          node --check test-honartik-universal-installer-l4-v1.cjs
          node --check honartik-universal-installer-native-fs-v1.cjs
          node --check test-honartik-universal-installer-native-fs-v1.cjs
          node --check honartik-universal-installer-native-root-receipt-v1.cjs
          node --check test-honartik-universal-installer-native-root-receipt-v1.cjs
          node --check honartik-universal-installer-l4-approval-verify-v1.cjs
          node --check test-honartik-universal-installer-l4-approval-verify-v1.cjs
          node --check honartik-universal-installer-native-root-preflight-v1.cjs
          node --check test-honartik-universal-installer-native-root-preflight-v1.cjs
          node --check honartik-universal-installer-native-approval-gate-v1.cjs
          node --check test-honartik-universal-installer-native-approval-gate-v1.cjs
          node --check honartik-universal-installer-native-l4-fence-v1.cjs
          node --check test-honartik-universal-installer-native-l4-fence-v1.cjs
          node --check honartik-universal-installer-native-recovery-transaction-v1.cjs
          node --check test-honartik-universal-installer-native-recovery-transaction-v1.cjs
          node --check honartik-universal-installer-native-journal-inspector-v1.cjs
          node --check test-honartik-universal-installer-native-journal-inspector-v1.cjs
          node --check honartik-universal-installer-native-journal-writer-v1.cjs
          node --check test-honartik-universal-installer-native-journal-writer-v1.cjs
          node --check honartik-universal-installer-native-python-bridge-v1.cjs
          node --check test-honartik-universal-installer-native-python-bridge-v1.cjs
          node --check honartik-universal-installer-native-reconciler-v1.cjs
          node --check test-honartik-universal-installer-native-reconciler-v1.cjs
          node --check honartik-universal-installer-native-terminal-archive-v1.cjs
          node --check honartik-universal-installer-registration-review-pack-v1.cjs
          node --check test-honartik-universal-installer-registration-review-pack-v1.cjs
          node --check honartik-universal-installer-owner-registration-candidate-v1.cjs
          node --check test-honartik-universal-installer-owner-registration-candidate-v1.cjs
          node --check honartik-universal-installer-native-root-transaction-v1.cjs
          node --check test-honartik-universal-installer-native-root-transaction-v1.cjs
          node --check honartik-universal-installer-native-dispatch-trust-v1.cjs
          node --check test-honartik-universal-installer-native-dispatch-trust-v1.cjs
          node --check honartik-universal-installer-native-dispatch-registration-review-v1.cjs
          node --check honartik-universal-installer-owner-bootstrap-native-fs-v1.cjs
          node --check test-honartik-universal-installer-owner-bootstrap-linux-v1.cjs
          node --check test-honartik-universal-installer-owner-bootstrap-crash-child-v1.cjs
          node --check honartik-universal-installer-owner-bootstrap-plan-review-v1.cjs
          node --check test-honartik-universal-installer-owner-bootstrap-plan-review-v1.cjs
          node --check test-honartik-universal-installer-native-dispatch-registration-review-v1.cjs
          node -e "process.stdout.write(require('./honartik-universal-installer-native-python-bridge-v1.cjs').fixedPythonCode())" | python3 -c "import sys,ast;ast.parse(sys.stdin.read());print('FIXED_PYTHON_CODE_SYNTAX=PASS')"
          node --check honartik-universal-installer-journal-finalize-fixture-v1.cjs
          node --check test-honartik-universal-installer-journal-finalize-fixture-v1.cjs
          node --test \
            test-honartik-universal-installer-l4-v1.cjs \
            test-honartik-universal-installer-native-fs-v1.cjs \
            test-honartik-universal-installer-native-root-receipt-v1.cjs \
            test-honartik-universal-installer-l4-approval-verify-v1.cjs \
            test-honartik-universal-installer-native-root-preflight-v1.cjs \
            test-honartik-universal-installer-native-approval-gate-v1.cjs \
            test-honartik-universal-installer-native-l4-fence-v1.cjs \
            test-honartik-universal-installer-native-recovery-transaction-v1.cjs \
            test-honartik-universal-installer-native-journal-inspector-v1.cjs \
            test-honartik-universal-installer-native-journal-writer-v1.cjs \
            test-honartik-universal-installer-native-python-bridge-v1.cjs \
            test-honartik-universal-installer-native-reconciler-v1.cjs \
            test-honartik-universal-installer-registration-review-pack-v1.cjs \
            test-honartik-universal-installer-owner-registration-candidate-v1.cjs \
            test-honartik-universal-installer-native-root-transaction-v1.cjs \
            test-honartik-universal-installer-native-dispatch-trust-v1.cjs \
            test-honartik-universal-installer-native-dispatch-registration-review-v1.cjs \
            test-honartik-universal-installer-journal-finalize-fixture-v1.cjs \
            test-honartik-universal-installer-owner-bootstrap-linux-v1.cjs \
            test-honartik-universal-installer-owner-bootstrap-plan-review-v1.cjs
      - name: Assert no runtime installation authorized
        shell: bash
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const m=require('./manifests/honartik-universal-installer-l4-issue217.json');
          const op=require('./honartik-universal-installer-l4-v1.cjs');
          assert.equal(m.registered_on_host,false);
          assert.equal(m.production_executable,false);
          assert.equal(m.root_adapter_implemented,false);
          assert.equal(m.approval_issued,false);
          assert.equal(m.backend_deployed,false);
          assert.equal(op.CONTRACT.installer_only,true);
          assert.equal(op.CONTRACT.no_yii_migrations,true);
          assert.equal(op.CONTRACT.candidate_digest,m.candidate_digest);
          console.log('CONTRACT_TESTS_ONLY=PASS HOST_INSTALL=NOT_AUTHORIZED');
          NODE

  isolated-real-systemd-vm-rollback:
    # Disposable GitHub-hosted Ubuntu VM. No Provider access or production secrets.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Real systemd isolated four-owner commit, restart failure, crash recovery
        shell: bash
        run: |
          set -euo pipefail
          node --check test-honartik-universal-installer-owner-bootstrap-systemd-vm-v1.cjs
          test "${GITHUB_ACTIONS:-}" = "true"
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
          test -S /run/systemd/private
          NODE_EXE="$(command -v node)"
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_WORKSPACE \
            "$NODE_EXE" test-honartik-universal-installer-owner-bootstrap-systemd-vm-v1.cjs
