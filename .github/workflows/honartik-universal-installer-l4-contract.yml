name: Honartik Universal Installer L4 — Source Contract Only

on:
  pull_request:
    paths:
      - 'honartik-universal-installer-l4-v1.cjs'
      - 'test-honartik-universal-installer-l4-v1.cjs'
      - 'manifests/honartik-universal-installer-l4-issue217.json'
      - 'docs/runbooks/honartik-universal-installer-l4-issue217.md'
      - '.github/workflows/honartik-universal-installer-l4-contract.yml'

permissions:
  contents: read

jobs:
  source-only-negative-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax and isolated tests
        shell: bash
        run: |
          set -euo pipefail
          node --check honartik-universal-installer-l4-v1.cjs
          node --check test-honartik-universal-installer-l4-v1.cjs
          node --test test-honartik-universal-installer-l4-v1.cjs
      - name: Assert no runtime installation authorized
        shell: bash
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const m=require('./manifests/honartik-universal-installer-l4-issue217.json');
          const op=require('./honartik-universal-installer-l4-v1.cjs');
          assert.equal(m.registered_on_host,false);
          assert.equal(m.production_executable,false);
          assert.equal(m.root_adapter_implemented,false);
          assert.equal(m.approval_issued,false);
          assert.equal(m.backend_deployed,false);
          assert.equal(op.CONTRACT.installer_only,true);
          assert.equal(op.CONTRACT.no_yii_migrations,true);
          assert.equal(op.CONTRACT.candidate_digest,m.candidate_digest);
          console.log('CONTRACT_TESTS_ONLY=PASS HOST_INSTALL=NOT_AUTHORIZED');
          NODE
