name: U01 Root-of-Trust current-baseline admission (read-only)
on:
  pull_request:
    paths:
      - 'u01-universal-root-trust-current-preflight-v1.cjs'
      - 'test-u01-universal-root-trust-current-preflight-v1.cjs'
      - '.github/workflows/u01-root-trust-current-preflight-ci.yml'
      - 'docs/runbooks/u01-root-trust-current-baseline-20261109.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-fail-closed-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Exact SHA, root mode and authority negative tests
        run: node --test test-u01-universal-root-trust-current-preflight-v1.cjs
      - name: Verify syntax and no new production action
        run: |
          node --check u01-universal-root-trust-current-preflight-v1.cjs
          node --check test-u01-universal-root-trust-current-preflight-v1.cjs
