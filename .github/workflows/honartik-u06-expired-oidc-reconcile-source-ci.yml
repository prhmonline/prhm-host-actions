name: U06 expired owner OIDC reconciliation — SOURCE ONLY
on:
  push:
    branches:
      - feature/u06-expired-owner-oidc-reconcile-20261114
  pull_request:
    paths:
      - 'honartik-u06-expired-owner-challenge-reconcile-v1.cjs'
      - 'honartik-u06-expired-owner-reconcile-registration-review-v1.cjs'
      - 'honartik-u06-expired-owner-four-owner-preflight-v1.cjs'
      - 'honartik-u06-expired-owner-reconcile-l4-consumed-v1.cjs'
      - 'honartik-u06-expired-owner-policy-postimage-v1.cjs'
      - 'honartik-u06-root-signed-shared-lock-candidate-v1.cjs'
      - 'honartik-u06-isolated-root-native-path-v1.cjs'
      - 'test-honartik-u06-isolated-root-native-path-v1.cjs'
      - 'test-honartik-u06-root-signed-shared-lock-candidate-v1.cjs'
      - 'test-honartik-u06-expired-owner-policy-postimage-v1.cjs'
      - 'test-honartik-u06-expired-owner-reconcile-l4-consumed-v1.cjs'
      - 'test-honartik-u06-expired-owner-four-owner-preflight-v1.cjs'
      - 'test-honartik-u06-expired-owner-reconcile-registration-review-v1.cjs'
      - 'honartik-u06-shared-exclusive-lock-v1.cjs'
      - 'honartik-u06-shared-actor-integration-v1.cjs'
      - 'honartik-u06-root-sealed-evidence-staging-v1.cjs'
      - 'test-honartik-u06-real-root-actor-lock-guards-v1.cjs'
      - 'honartik-u06-native-root-lease-v1.cjs'
      - 'honartik-u06-real-root-callback-adapter-v1.cjs'
      - 'honartik-u06-owner-oidc-once-fence-v1.cjs'
      - 'honartik-u06-owner-native-transaction-v1.cjs'
      - 'test-honartik-u06-shared-actor-integration-v1.cjs'
      - 'test-honartik-u06-shared-exclusive-lock-v1.cjs'
      - 'test-honartik-u06-expired-owner-challenge-reconcile-v1.cjs'
      - 'honartik-u06-root-owner-proof-bridge-v1.cjs'
      - '.github/workflows/honartik-u06-expired-oidc-reconcile-source-ci.yml'
permissions:
  contents: read
jobs:
  unprivileged-filesystem-and-sigkill:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and unprivileged crash-recovery tests
        run: |
          set -euo pipefail
          test "$(id -u)" != 0
          node --check honartik-u06-expired-owner-challenge-reconcile-v1.cjs
          node --check honartik-u06-expired-owner-reconcile-registration-review-v1.cjs
          node --check honartik-u06-expired-owner-four-owner-preflight-v1.cjs
          node --check honartik-u06-expired-owner-reconcile-l4-consumed-v1.cjs
          node --check honartik-u06-expired-owner-policy-postimage-v1.cjs
          node --check honartik-u06-root-signed-shared-lock-candidate-v1.cjs
          node --check honartik-u06-isolated-root-native-path-v1.cjs
          node --check honartik-u06-shared-exclusive-lock-v1.cjs
          node --check honartik-u06-shared-actor-integration-v1.cjs
          node --check honartik-u06-root-sealed-evidence-staging-v1.cjs
          node --check honartik-u06-native-root-lease-v1.cjs
          node --check honartik-u06-real-root-callback-adapter-v1.cjs
          node --check honartik-u06-owner-oidc-once-fence-v1.cjs
          node --check honartik-u06-owner-native-transaction-v1.cjs
          node --check honartik-u06-root-owner-proof-bridge-v1.cjs
          node --test test-honartik-u06-expired-owner-challenge-reconcile-v1.cjs test-honartik-u06-shared-exclusive-lock-v1.cjs test-honartik-u06-shared-actor-integration-v1.cjs test-honartik-u06-real-root-actor-lock-guards-v1.cjs test-honartik-u06-expired-owner-reconcile-registration-review-v1.cjs test-honartik-u06-expired-owner-four-owner-preflight-v1.cjs test-honartik-u06-expired-owner-reconcile-l4-consumed-v1.cjs test-honartik-u06-expired-owner-policy-postimage-v1.cjs test-honartik-u06-root-signed-shared-lock-candidate-v1.cjs test-honartik-u06-isolated-root-native-path-v1.cjs
          node - <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const bridge=fs.readFileSync('honartik-u06-root-owner-proof-bridge-v1.cjs','utf8');
          assert.match(bridge,/const RECOVERY=DIR\+'\/reconciliation\.journal\.json'/);
          assert.match(bridge,/\[CHALLENGE,PRIVATE,ENVELOPE,RECOVERY\]/);
          const proposedPolicy=require('./honartik-u06-expired-owner-policy-postimage-v1.cjs');
          assert.equal(proposedPolicy.PRODUCTION_APPLY_EXPORTED,false);
          assert.equal(proposedPolicy.ROOT_INSTALLER,false);
          const signedRecover=require('./honartik-u06-expired-owner-reconcile-l4-consumed-v1.cjs');
          assert.equal(signedRecover.ROOT_APPLY,false);
          assert.equal(signedRecover.LEVEL4_ISSUER,false);
          assert.notEqual(signedRecover.OPERATION,signedRecover.NATIVE_OPERATION);
          const fourOwner=require('./honartik-u06-expired-owner-four-owner-preflight-v1.cjs');
          assert.equal(fourOwner.PRODUCTION_AUTHORIZED,false);
          assert.equal(fourOwner.ROOT_INSTALLER_EXPORTED,false);
          const registrationReview=require('./honartik-u06-expired-owner-reconcile-registration-review-v1.cjs');
          assert.equal(registrationReview.ROOT_ACTION_REGISTERED,false);
          assert.equal(registrationReview.PRODUCTION_MUTATION_AUTHORIZED,false);
          assert.equal(registrationReview.LEVEL4_ISSUER,false);
          const isolatedNative=require('./honartik-u06-isolated-root-native-path-v1.cjs');
          assert.equal(isolatedNative.PRODUCTION_APPLY,false);
          assert.equal(isolatedNative.NATIVE_BACKUP_EXECUTABLE,false);
          assert.equal(isolatedNative.ROOT_ACTION_REGISTERED,false);
          const rootLockCandidate=require('./honartik-u06-root-signed-shared-lock-candidate-v1.cjs');
          assert.equal(rootLockCandidate.LIVE_ROOT_CONSTRUCTOR_EXPORTED,false);
          assert.equal(rootLockCandidate.L4_ISSUER,false);
          assert.equal(rootLockCandidate.PRODUCTION_APPLY,false);
          assert.equal(Object.keys(rootLockCandidate.ALLOWED).length,2);
          const stage=require('./honartik-u06-root-sealed-evidence-staging-v1.cjs');
          assert.equal(stage.PRODUCTION_AUTHORIZED,false);
          assert.equal(stage.ROOT_HANDLER_REGISTERED,false);
          const integrated=require('./honartik-u06-shared-actor-integration-v1.cjs');
          assert.equal(integrated.PRODUCTION_AUTHORIZED,false);
          assert.equal(integrated.ROOT_ENTRYPOINT,false);
          assert.equal(integrated.KINDS.length,5);
          const shared=require('./honartik-u06-shared-exclusive-lock-v1.cjs');
          assert.equal(shared.PRODUCTION_AUTHORIZED,false);
          assert.equal(shared.ROOT_ENTRYPOINT,false);
          assert.equal(shared.KINDS.length,5);
          const r=require('./honartik-u06-expired-owner-challenge-reconcile-v1.cjs');
          assert.equal(r.LIVE_RECONCILIATION_EXPORTED,false);
          assert.equal(r.ROOT_HANDLER_REGISTERED,false);
          assert.equal(r.PRODUCTION_MUTATION_AUTHORIZED,false);
          console.log('SOURCE_ONLY=PASS');
          console.log('PRODUCTION_DEPLOY_AUTHORIZED=FALSE');
          NODE
