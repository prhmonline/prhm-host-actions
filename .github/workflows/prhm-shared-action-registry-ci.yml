name: PRHM Shared Agent 3 Registration Gate

on:
  pull_request:
  push:
    branches:
      - main
      - integration/honartik-config-center-enrollment-action-v1-20261012

permissions:
  contents: read

jobs:
  shared_registration_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reusable registry, Ed25519, anti-replay and bootstrap-phase contracts
        run: |
          set -euo pipefail
          node --check prhm-action-registry-gateway-v1.cjs
          node --check test-prhm-action-registry-gateway-v1.cjs
          node --check prhm-action-registry-host-actions-v2-bridge-v1.cjs
          node --check test-prhm-action-registry-host-actions-v2-bridge-v1.cjs
          node --check test-prhm-action-registry-postinstall-rollback-v1.cjs
          node --test test-prhm-action-registry-gateway-v1.cjs test-prhm-action-registry-host-actions-v2-bridge-v1.cjs test-prhm-action-registry-postinstall-rollback-v1.cjs
      - name: Validate bounded iMotion Compose discovery adapter
        run: |
          set -euo pipefail
          node --check imotion-compose-discovery-readonly-v1.cjs
          node --check test-imotion-compose-discovery-readonly-v1.cjs
          node --check imotion-compose-fixed-host-inspector-v1.cjs
          node --check test-imotion-compose-fixed-host-inspector-v1.cjs
          node --test test-imotion-compose-discovery-readonly-v1.cjs test-imotion-compose-fixed-host-inspector-v1.cjs
      - name: Explicit Production not installed acknowledgment
        run: |
          # A successful source contract never means an MCP tool was installed.
          # The deployment approval, discovery and remote consumer checks must
          # run through the trusted Agent 3/Approval Center path, not this CI.
          test -f PRHM-ACTION-REGISTRY-ONBOARDING-STANDARD.md
