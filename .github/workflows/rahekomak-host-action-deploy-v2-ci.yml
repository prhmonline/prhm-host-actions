name: RahKomak Host Action sandbox and SHA-bound deploy candidate

on:
  pull_request:
    paths:
      - 'rahekomak-production-deploy-worker-v2.js'
      - 'rahekomak-host-action-executor-patch-v2.js'
      - 'test-rahekomak-production-deploy-worker-v2.js'
      - 'test-rahekomak-host-action-executor-patch-v2.js'
      - 'rahekomak-host-action-repair-installer-v2.js'
      - 'test-rahekomak-host-action-repair-installer-v2.js'
      - 'rahekomak-host-action-activation-v2.js'
      - 'test-rahekomak-host-action-activation-v2.js'
      - '.github/workflows/rahekomak-host-action-deploy-v2-ci.yml'
  push:
    branches:
      - fix/rahekomak-host-action-sandbox-sha-v2
    paths:
      - 'rahekomak-production-deploy-worker-v2.js'
      - 'rahekomak-host-action-executor-patch-v2.js'
      - 'test-rahekomak-production-deploy-worker-v2.js'
      - 'test-rahekomak-host-action-executor-patch-v2.js'
      - 'rahekomak-host-action-repair-installer-v2.js'
      - 'test-rahekomak-host-action-repair-installer-v2.js'
      - 'rahekomak-host-action-activation-v2.js'
      - 'test-rahekomak-host-action-activation-v2.js'
      - '.github/workflows/rahekomak-host-action-deploy-v2-ci.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          node --check rahekomak-production-deploy-worker-v2.js
          node --check rahekomak-host-action-executor-patch-v2.js
          node --check test-rahekomak-production-deploy-worker-v2.js
          node --check test-rahekomak-host-action-executor-patch-v2.js
          node --check rahekomak-host-action-repair-installer-v2.js
          node --check test-rahekomak-host-action-repair-installer-v2.js
          node --check rahekomak-host-action-activation-v2.js
          node --check test-rahekomak-host-action-activation-v2.js
      - name: Run fail-closed contract tests
        run: node --test test-rahekomak-production-deploy-worker-v2.js test-rahekomak-host-action-executor-patch-v2.js test-rahekomak-host-action-repair-installer-v2.js test-rahekomak-host-action-activation-v2.js
