name: Agent 3 Backup and Read Broker Tests
on:
  push:
    branches: [feature/agent3-universal-backup-engine]
  workflow_dispatch:
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # verify immutable historical source Git objects
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify exact candidate installer SHA-256 before security suite
        run: sha256sum ops/agent3-universal-backup/install-candidate.js
      - run: node --test test/agent3-five-field-live-contract-inspector.test.cjs test/agent3-operator-live-patch-preview.test.cjs test/agent3-durable-execution-claim.test.cjs test/agent3-once-only-execution-claim.test.cjs test/agent3-four-owner-live-patch-preflight.test.cjs test/agent3-installer-filesystem-security.test.cjs test/agent3-immutable-source-commit.test.cjs test/agent3-single-registrar-entrypoint.test.cjs test/agent3-shared-registrar-dispatch.test.cjs test/agent3-four-owner-patch-proposal.test.cjs test/agent3-operator-readonly-observation.test.cjs test/agent3-manifest-candidate.test.cjs test/agent3-live-owner-pins.test.cjs test/agent3-four-owner-readonly-preflight.test.cjs test/agent3-registration-contract.test.cjs test/agent3-restore-transaction.test.js test/agent3-release-lock.test.js test/agent3-encrypted-crash.test.js test/agent3-installer-gate.test.js test/agent3-policy-broker.test.js test/agent3-encrypted-bundle.test.js test/universal-backup-*.test.js test/agent3-imotion-backup-inventory.test.js test/agent3-confined-open.test.js test/agent3-read-broker.test.js test/agent3-read-broker-security-gates.test.js test/agent3-read-broker-boundaries.test.js test/universal-backup-isolated-smoke.test.js test/universal-backup-failure-rollback.test.js test/universal-backup-malformed-plan.test.js test/universal-backup-completion-marker.test.js

      - name: Exact source SHA-256 evidence for approved installer
        run: |
          sha256sum \
            lib/agent3-confined-open.js \
            lib/universal-backup-policy.js \
            lib/agent3-encrypted-bundle.candidate.js \
            lib/agent3-policy-broker.candidate.js \
            ops/agent3-universal-backup/install-candidate.js
