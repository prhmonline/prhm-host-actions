name: current-owner-bootstrap-repair-temp-ci

on:
  push:
    branches:
      - repair/current-owner-bootstrap-clean-v1

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check control-plane-current-owner-bootstrap-repair-v1.js
          node --check bootstrap-host-actions-control-plane-current-owner-bootstrap-repair-v1.js
          node --check test-control-plane-current-owner-bootstrap-repair-v1.js
      - name: Static safety contract
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const h=require('./control-plane-current-owner-bootstrap-repair-v1.js');
          const b=require('./bootstrap-host-actions-control-plane-current-owner-bootstrap-repair-v1.js');
          const m=h.manifest();
          const p=b.registrationPlan();
          assert.equal(m.action,'control_plane_current_owner_bootstrap_repair_v1');
          assert.equal(m.production_mutation,false);
          assert.equal(m.database_mutation,false);
          assert.equal(m.arbitrary_command,false);
          assert.equal(m.arbitrary_path,false);
          assert.equal(p.action,m.action);
          assert.equal(p.risk,'critical');
          assert.equal(p.level,4);
          assert.equal(p.zero_input,true);
          assert.equal(p.production_mutation,false);
          assert.equal(p.database_mutation,false);
          assert.equal(h.apply.length,0);
          assert.equal(h.preflight.length,0);
          assert.equal(h.manifest.length,0);
          console.log('static contract PASS');
          NODE
