name: Honartik finance release — owner OIDC identity only (NO DEPLOY)
on:
  workflow_dispatch:
    inputs:
      challenge:
        description: '64 lower-case hex challenge generated by the trusted finance host verifier'
        required: true
        type: string
      host_transport_x25519_public_key_b64:
        description: 'Ephemeral host X25519 public key DER/SPKI base64, never a private key'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  signed-finance-identity-only:
    if: ${{ github.ref == 'refs/heads/main' && github.actor_id == '193396069' }}
    runs-on: ubuntu-latest
    environment: honartik-finance-production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Seal owner GitHub OIDC JWT for exact finance release intent
        id: seal
        env:
          HONARTIK_FINANCE_CHALLENGE: ${{ inputs.challenge }}
          HONARTIK_FINANCE_TRANSPORT_PUB_B64: ${{ inputs.host_transport_x25519_public_key_b64 }}
        run: node honartik-finance-owner-oidc-sealed-v1.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: honartik-finance-owner-proof-encrypted-${{ github.run_id }}
          path: ${{ steps.seal.outputs.sealed_path }}
          retention-days: 1
          if-no-files-found: error
