name: Honartik open-price dark release source safety
on:
  push:
    paths:
      - '.github/workflows/honartik-open-price-dark-source.yml'
      - 'test-honartik-open-price-dark-release-v1.cjs'
      - 'test-fixtures/honartik-open-price-dark-release/**'
  pull_request:
    paths:
      - '.github/workflows/honartik-open-price-dark-source.yml'
      - 'test-honartik-open-price-dark-release-v1.cjs'
      - 'test-fixtures/honartik-open-price-dark-release/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protected-production-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact published source blobs and protected live overlay
        shell: bash
        run: |
          set -euo pipefail
          node --test test-honartik-open-price-dark-release-v1.cjs
          echo 'DARK_RELEASE_SOURCE_BOUNDARY=PASS'
          echo 'PRODUCTION_DATABASE_UNCHANGED=YES'
          echo 'PRODUCTION_DEPLOYED=NO'
